server:
  port: ${CRM_SERVER_PORT:8080}

spring:
  application:
    name: crm
  servlet:
    multipart:
      max-file-size: ${CRM_UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${CRM_UPLOAD_MAX_REQUEST_SIZE:12MB}
  datasource:
    url: ${CRM_DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${CRM_DB_USERNAME:app_user}
    password: ${CRM_DB_PASSWORD:app123456}
    driver-class-name: org.postgresql.Driver
    druid:
      initial-size: ${CRM_DRUID_INITIAL_SIZE:1}
      min-idle: ${CRM_DRUID_MIN_IDLE:1}
      max-active: ${CRM_DRUID_MAX_ACTIVE:20}
      max-wait: ${CRM_DRUID_MAX_WAIT:60000}
      time-between-eviction-runs-millis: ${CRM_DRUID_EVICTION_INTERVAL:60000}
      min-evictable-idle-time-millis: ${CRM_DRUID_MIN_EVICTABLE_IDLE_TIME:300000}
      validation-query: ${CRM_DRUID_VALIDATION_QUERY:select 1}
      max-open-prepared-statements: 20
      pool-prepared-statements: false
      max-pool-prepared-statement-per-connection-size: 0
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${CRM_JPA_DDL_AUTO:update}
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${CRM_REDIS_HOST:127.0.0.1}
      port: ${CRM_REDIS_PORT:6379}
      password: ${CRM_REDIS_PASSWORD:}
      database: ${CRM_REDIS_DATABASE:1}
  kafka:
    bootstrap-servers: ${CRM_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  config: classpath:logback-spring.xml
  level:
    root: ${CRM_LOG_LEVEL:INFO}

crm:
  logging:
    path: ${CRM_LOG_PATH:./logs}
    max-history: ${CRM_LOG_MAX_HISTORY:30}
    max-file-size: ${CRM_LOG_MAX_FILE_SIZE:100MB}
  jwt:
    secret: ${CRM_JWT_SECRET:please-change-this-secret-key-to-at-least-32-bytes}
    ttl-seconds: ${CRM_JWT_TTL_SECONDS:86400}
  auth:
    password-reset:
      ttl-seconds: ${CRM_PASSWORD_RESET_TTL_SECONDS:900}
      expose-token: ${CRM_PASSWORD_RESET_EXPOSE_TOKEN:true}
  redis:
    enabled: ${CRM_REDIS_ENABLED:true}
  channel:
    upload-dir: ${CRM_CHANNEL_UPLOAD_DIR:./uploads/channel}
  wecom:
    base-url: ${CRM_WECOM_BASE_URL:https://qyapi.weixin.qq.com}
    connect-timeout-ms: ${CRM_WECOM_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${CRM_WECOM_READ_TIMEOUT_MS:30000}
    schedule-delay-ms: ${CRM_WECOM_SCHEDULE_DELAY_MS:60000}
    schedule-initial-delay-ms: ${CRM_WECOM_SCHEDULE_INITIAL_DELAY_MS:30000}
  nacos:
    enabled: ${CRM_NACOS_ENABLED:false}
    server-addr: ${CRM_NACOS_SERVER_ADDR:localhost:8848}
    namespace: ${CRM_NACOS_NAMESPACE:}
    group: ${CRM_NACOS_GROUP:DEFAULT_GROUP}
  storage:
    upload-dir: ${CRM_STORAGE_UPLOAD_DIR:./uploads}
    public-path: ${CRM_STORAGE_PUBLIC_PATH:/uploads}
    minio:
      enabled: ${CRM_MINIO_ENABLED:false}
      endpoint: ${CRM_MINIO_ENDPOINT:http://localhost:9000}
      public-url: ${CRM_MINIO_PUBLIC_URL:}
      access-key: ${CRM_MINIO_ACCESS_KEY:}
      secret-key: ${CRM_MINIO_SECRET_KEY:}
      bucket: ${CRM_MINIO_BUCKET:crm}
      public-read: ${CRM_MINIO_PUBLIC_READ:true}
  search:
    elasticsearch:
      enabled: ${CRM_ES_ENABLED:true}
      uris: ${CRM_ES_URIS:http://192.168.50.105:9200}
      username: ${CRM_ES_USERNAME:}
      password: ${CRM_ES_PASSWORD:}
  knowledge:
    change:
      reconcile-delay-ms: ${CRM_KB_CHANGE_RECONCILE_DELAY_MS:3000}
      reconcile-initial-delay-ms: ${CRM_KB_CHANGE_RECONCILE_INITIAL_DELAY_MS:10000}
      kafka:
        enabled: ${CRM_KB_KAFKA_ENABLED:false}
        topic: ${CRM_KB_KAFKA_TOPIC:crm-knowledge-change}
        group-id: ${CRM_KB_KAFKA_GROUP_ID:crm-knowledge-indexer}
        publish-batch-size: ${CRM_KB_KAFKA_PUBLISH_BATCH_SIZE:100}
        publish-delay-ms: ${CRM_KB_KAFKA_PUBLISH_DELAY_MS:1000}
        publish-initial-delay-ms: ${CRM_KB_KAFKA_PUBLISH_INITIAL_DELAY_MS:5000}
        send-timeout-ms: ${CRM_KB_KAFKA_SEND_TIMEOUT_MS:10000}
    search:
      hybrid:
        vector-candidates: ${CRM_KB_SEARCH_VECTOR_CANDIDATES:20}
        keyword-candidates: ${CRM_KB_SEARCH_KEYWORD_CANDIDATES:20}
        database-candidates: ${CRM_KB_SEARCH_DATABASE_CANDIDATES:20}
        vector-weight: ${CRM_KB_SEARCH_VECTOR_WEIGHT:0.55}
        keyword-weight: ${CRM_KB_SEARCH_KEYWORD_WEIGHT:0.35}
        database-weight: ${CRM_KB_SEARCH_DATABASE_WEIGHT:0.10}
        rrf-k: ${CRM_KB_SEARCH_RRF_K:60}
        min-score: ${CRM_KB_SEARCH_MIN_SCORE:0}
        database-fallback-only: ${CRM_KB_SEARCH_DATABASE_FALLBACK_ONLY:true}
    ingest:
      stale-task-minutes: ${CRM_KB_INGEST_STALE_TASK_MINUTES:120}
      executor:
        core-size: ${CRM_KB_INGEST_CORE_SIZE:2}
        max-size: ${CRM_KB_INGEST_MAX_SIZE:4}
        queue-capacity: ${CRM_KB_INGEST_QUEUE_CAPACITY:100}
    chunk:
      max-chars: ${CRM_KB_CHUNK_MAX_CHARS:900}
      overlap-chars: ${CRM_KB_CHUNK_OVERLAP_CHARS:120}
    embedding:
      enabled: ${CRM_KB_EMBEDDING_ENABLED:true}
      base-url: ${CRM_KB_EMBEDDING_BASE_URL:http://localhost:11434/v1}
      api-key: ${CRM_KB_EMBEDDING_API_KEY:}
      model: ${CRM_KB_EMBEDDING_MODEL:bge-m3:latest}
      dimensions: ${CRM_KB_EMBEDDING_DIMENSIONS:0}
      timeout-ms: ${CRM_KB_EMBEDDING_TIMEOUT_MS:30000}
    elasticsearch:
      index-name: ${CRM_KB_ES_INDEX:crm_knowledge_chunk}
      timeout-ms: ${CRM_KB_ES_TIMEOUT_MS:10000}
    milvus:
      enabled: ${CRM_KB_MILVUS_ENABLED:true}
      endpoint: ${CRM_KB_MILVUS_ENDPOINT:http://192.168.50.105:19530}
      token: ${CRM_KB_MILVUS_TOKEN:}
      database: ${CRM_KB_MILVUS_DATABASE:}
      collection: ${CRM_KB_MILVUS_COLLECTION:crm_knowledge_chunk}
      timeout-ms: ${CRM_KB_MILVUS_TIMEOUT_MS:10000}
  agent:
    workspace: ${CRM_AGENT_WORKSPACE:./data/agent-runtime}
    web-search:
      enabled: ${CRM_AGENT_WEB_SEARCH_ENABLED:true}
      provider: ${CRM_AGENT_WEB_SEARCH_PROVIDER:searxng}
      endpoint: ${CRM_AGENT_WEB_SEARCH_ENDPOINT:http://180.76.225.232:8888}
      api-key: ${CRM_AGENT_WEB_SEARCH_API_KEY:}
      timeout-ms: ${CRM_AGENT_WEB_SEARCH_TIMEOUT_MS:8000}
      max-results: ${CRM_AGENT_WEB_SEARCH_MAX_RESULTS:5}
      fetch-detail: ${CRM_AGENT_WEB_SEARCH_FETCH_DETAIL:true}
      detail-limit: ${CRM_AGENT_WEB_SEARCH_DETAIL_LIMIT:3}
    token:
      daily-limit: ${CRM_AGENT_TOKEN_DAILY_LIMIT:100000}
      reserve-output-tokens: ${CRM_AGENT_TOKEN_RESERVE_OUTPUT_TOKENS:2048}
  ai:
    runtime:
      url: ${CRM_AI_RUNTIME_URL:http://localhost:8001}
      internal-token: ${CRM_AI_INTERNAL_TOKEN:}
      timeout-ms: ${CRM_AI_RUNTIME_TIMEOUT_MS:90000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
