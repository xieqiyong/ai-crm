services:
  crm-postgres:
    image: docker.1ms.run/postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CRM_DB_NAME}
      POSTGRES_USER: ${CRM_DB_USERNAME}
      POSTGRES_PASSWORD: ${CRM_DB_PASSWORD}
      TZ: ${CRM_TIMEZONE}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crm-net

  crm-redis:
    image: docker.1ms.run/redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${CRM_REDIS_PASSWORD}
      TZ: ${CRM_TIMEZONE}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG; else redis-cli ping | grep PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crm-net

  crm-minio:
    image: docker.1ms.run/minio/minio:latest
    container_name: crm-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${CRM_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${CRM_MINIO_SECRET_KEY:-please-change-minio-secret}
      TZ: ${CRM_TIMEZONE}
    command:
      - server
      - /data
      - --console-address
      - :9001
    volumes:
      - ./data/minio:/data
    networks:
      - crm-net

  crm-backend:
    image: crm-backend:${CRM_VERSION}
    container_name: crm-backend
    restart: unless-stopped
    depends_on:
      crm-postgres:
        condition: service_healthy
      crm-redis:
        condition: service_healthy
      crm-minio:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${CRM_TIMEZONE}
      JAVA_OPTS: ${CRM_JAVA_OPTS}
      CRM_SERVER_PORT: 8080
      CRM_DB_URL: jdbc:postgresql://crm-postgres:5432/${CRM_DB_NAME}
      CRM_DB_USERNAME: ${CRM_DB_USERNAME}
      CRM_DB_PASSWORD: ${CRM_DB_PASSWORD}
      CRM_JPA_DDL_AUTO: ${CRM_JPA_DDL_AUTO}
      CRM_DRUID_INITIAL_SIZE: ${CRM_DRUID_INITIAL_SIZE}
      CRM_DRUID_MIN_IDLE: ${CRM_DRUID_MIN_IDLE}
      CRM_DRUID_MAX_ACTIVE: ${CRM_DRUID_MAX_ACTIVE}
      CRM_DRUID_MAX_WAIT: ${CRM_DRUID_MAX_WAIT}
      CRM_DRUID_EVICTION_INTERVAL: ${CRM_DRUID_EVICTION_INTERVAL}
      CRM_DRUID_MIN_EVICTABLE_IDLE_TIME: ${CRM_DRUID_MIN_EVICTABLE_IDLE_TIME}
      CRM_DRUID_VALIDATION_QUERY: ${CRM_DRUID_VALIDATION_QUERY}
      CRM_REDIS_ENABLED: ${CRM_REDIS_ENABLED}
      CRM_REDIS_HOST: crm-redis
      CRM_REDIS_PORT: 6379
      CRM_REDIS_PASSWORD: ${CRM_REDIS_PASSWORD}
      CRM_REDIS_DATABASE: ${CRM_REDIS_DATABASE}
      CRM_UPLOAD_MAX_FILE_SIZE: ${CRM_UPLOAD_MAX_FILE_SIZE}
      CRM_UPLOAD_MAX_REQUEST_SIZE: ${CRM_UPLOAD_MAX_REQUEST_SIZE}
      CRM_JWT_SECRET: ${CRM_JWT_SECRET}
      CRM_JWT_TTL_SECONDS: ${CRM_JWT_TTL_SECONDS}
      CRM_PASSWORD_RESET_TTL_SECONDS: ${CRM_PASSWORD_RESET_TTL_SECONDS}
      CRM_PASSWORD_RESET_EXPOSE_TOKEN: ${CRM_PASSWORD_RESET_EXPOSE_TOKEN}
      CRM_LOG_LEVEL: ${CRM_LOG_LEVEL:-INFO}
      CRM_LOG_PATH: /app/logs
      CRM_LOG_MAX_HISTORY: ${CRM_LOG_MAX_HISTORY:-30}
      CRM_LOG_MAX_FILE_SIZE: ${CRM_LOG_MAX_FILE_SIZE:-100MB}
      CRM_CHANNEL_UPLOAD_DIR: ${CRM_CHANNEL_UPLOAD_DIR}
      CRM_STORAGE_UPLOAD_DIR: ${CRM_STORAGE_UPLOAD_DIR}
      CRM_STORAGE_PUBLIC_PATH: ${CRM_STORAGE_PUBLIC_PATH}
      CRM_WECOM_BASE_URL: ${CRM_WECOM_BASE_URL:-https://qyapi.weixin.qq.com}
      CRM_WECOM_CONNECT_TIMEOUT_MS: ${CRM_WECOM_CONNECT_TIMEOUT_MS:-5000}
      CRM_WECOM_READ_TIMEOUT_MS: ${CRM_WECOM_READ_TIMEOUT_MS:-30000}
      CRM_WECOM_SCHEDULE_DELAY_MS: ${CRM_WECOM_SCHEDULE_DELAY_MS:-60000}
      CRM_WECOM_SCHEDULE_INITIAL_DELAY_MS: ${CRM_WECOM_SCHEDULE_INITIAL_DELAY_MS:-30000}
      CRM_WECOM_FETCH_DETAIL_ENABLED: ${CRM_WECOM_FETCH_DETAIL_ENABLED:-true}
      CRM_WECOM_FETCH_TAGS_ENABLED: ${CRM_WECOM_FETCH_TAGS_ENABLED:-true}
      CRM_AGENT_WORKSPACE: /app/data/agent-runtime
      CRM_AGENT_WEB_SEARCH_ENABLED: ${CRM_AGENT_WEB_SEARCH_ENABLED}
      CRM_AGENT_WEB_SEARCH_PROVIDER: ${CRM_AGENT_WEB_SEARCH_PROVIDER}
      CRM_AGENT_WEB_SEARCH_ENDPOINT: ${CRM_AGENT_WEB_SEARCH_ENDPOINT}
      CRM_AGENT_WEB_SEARCH_API_KEY: ${CRM_AGENT_WEB_SEARCH_API_KEY}
      CRM_AGENT_WEB_SEARCH_TIMEOUT_MS: ${CRM_AGENT_WEB_SEARCH_TIMEOUT_MS}
      CRM_AGENT_WEB_SEARCH_MAX_RESULTS: ${CRM_AGENT_WEB_SEARCH_MAX_RESULTS}
      CRM_AGENT_WEB_SEARCH_FETCH_DETAIL: ${CRM_AGENT_WEB_SEARCH_FETCH_DETAIL}
      CRM_AGENT_WEB_SEARCH_DETAIL_LIMIT: ${CRM_AGENT_WEB_SEARCH_DETAIL_LIMIT}
      CRM_AGENT_TOKEN_DAILY_LIMIT: ${CRM_AGENT_TOKEN_DAILY_LIMIT}
      CRM_AGENT_TOKEN_RESERVE_OUTPUT_TOKENS: ${CRM_AGENT_TOKEN_RESERVE_OUTPUT_TOKENS}
      CRM_AI_RUNTIME_URL: http://crm-ai-runtime:8001
      CRM_AI_INTERNAL_TOKEN: ${CRM_AI_INTERNAL_TOKEN}
      CRM_AI_RUNTIME_TIMEOUT_MS: ${CRM_AI_RUNTIME_TIMEOUT_MS}
      CRM_NACOS_ENABLED: ${CRM_NACOS_ENABLED}
      CRM_NACOS_SERVER_ADDR: ${CRM_NACOS_SERVER_ADDR}
      CRM_NACOS_NAMESPACE: ${CRM_NACOS_NAMESPACE}
      CRM_NACOS_GROUP: ${CRM_NACOS_GROUP}
      CRM_MINIO_ENABLED: ${CRM_MINIO_ENABLED:-false}
      CRM_MINIO_ENDPOINT: ${CRM_MINIO_ENDPOINT:-http://crm-minio:9000}
      CRM_MINIO_PUBLIC_URL: ${CRM_MINIO_PUBLIC_URL:-/minio}
      CRM_MINIO_ACCESS_KEY: ${CRM_MINIO_ACCESS_KEY:-minioadmin}
      CRM_MINIO_SECRET_KEY: ${CRM_MINIO_SECRET_KEY:-please-change-minio-secret}
      CRM_MINIO_BUCKET: ${CRM_MINIO_BUCKET:-crm}
      CRM_MINIO_PUBLIC_READ: ${CRM_MINIO_PUBLIC_READ:-true}
      CRM_ES_ENABLED: ${CRM_ES_ENABLED}
      CRM_ES_URIS: ${CRM_ES_URIS}
      CRM_ES_USERNAME: ${CRM_ES_USERNAME}
      CRM_ES_PASSWORD: ${CRM_ES_PASSWORD}
      CRM_KAFKA_BOOTSTRAP_SERVERS: ${CRM_KAFKA_BOOTSTRAP_SERVERS}
      CRM_KB_INGEST_CORE_SIZE: ${CRM_KB_INGEST_CORE_SIZE}
      CRM_KB_INGEST_MAX_SIZE: ${CRM_KB_INGEST_MAX_SIZE}
      CRM_KB_INGEST_QUEUE_CAPACITY: ${CRM_KB_INGEST_QUEUE_CAPACITY}
      CRM_KB_INGEST_STALE_TASK_MINUTES: ${CRM_KB_INGEST_STALE_TASK_MINUTES}
      CRM_KB_SEARCH_VECTOR_CANDIDATES: ${CRM_KB_SEARCH_VECTOR_CANDIDATES}
      CRM_KB_SEARCH_KEYWORD_CANDIDATES: ${CRM_KB_SEARCH_KEYWORD_CANDIDATES}
      CRM_KB_SEARCH_DATABASE_CANDIDATES: ${CRM_KB_SEARCH_DATABASE_CANDIDATES}
      CRM_KB_SEARCH_VECTOR_WEIGHT: ${CRM_KB_SEARCH_VECTOR_WEIGHT}
      CRM_KB_SEARCH_KEYWORD_WEIGHT: ${CRM_KB_SEARCH_KEYWORD_WEIGHT}
      CRM_KB_SEARCH_DATABASE_WEIGHT: ${CRM_KB_SEARCH_DATABASE_WEIGHT}
      CRM_KB_SEARCH_RRF_K: ${CRM_KB_SEARCH_RRF_K}
      CRM_KB_SEARCH_MIN_SCORE: ${CRM_KB_SEARCH_MIN_SCORE}
      CRM_KB_SEARCH_DATABASE_FALLBACK_ONLY: ${CRM_KB_SEARCH_DATABASE_FALLBACK_ONLY}
      CRM_KB_CHUNK_MAX_CHARS: ${CRM_KB_CHUNK_MAX_CHARS}
      CRM_KB_CHUNK_OVERLAP_CHARS: ${CRM_KB_CHUNK_OVERLAP_CHARS}
      CRM_KB_EMBEDDING_ENABLED: ${CRM_KB_EMBEDDING_ENABLED}
      CRM_KB_EMBEDDING_BASE_URL: ${CRM_KB_EMBEDDING_BASE_URL}
      CRM_KB_EMBEDDING_API_KEY: ${CRM_KB_EMBEDDING_API_KEY}
      CRM_KB_EMBEDDING_MODEL: ${CRM_KB_EMBEDDING_MODEL}
      CRM_KB_EMBEDDING_DIMENSIONS: ${CRM_KB_EMBEDDING_DIMENSIONS}
      CRM_KB_EMBEDDING_TIMEOUT_MS: ${CRM_KB_EMBEDDING_TIMEOUT_MS}
      CRM_KB_ES_INDEX: ${CRM_KB_ES_INDEX}
      CRM_KB_ES_TIMEOUT_MS: ${CRM_KB_ES_TIMEOUT_MS}
      CRM_KB_MILVUS_ENABLED: ${CRM_KB_MILVUS_ENABLED}
      CRM_KB_MILVUS_ENDPOINT: ${CRM_KB_MILVUS_ENDPOINT}
      CRM_KB_MILVUS_TOKEN: ${CRM_KB_MILVUS_TOKEN}
      CRM_KB_MILVUS_DATABASE: ${CRM_KB_MILVUS_DATABASE}
      CRM_KB_MILVUS_COLLECTION: ${CRM_KB_MILVUS_COLLECTION}
      CRM_KB_MILVUS_TIMEOUT_MS: ${CRM_KB_MILVUS_TIMEOUT_MS}
      CRM_KB_CHANGE_RECONCILE_DELAY_MS: ${CRM_KB_CHANGE_RECONCILE_DELAY_MS}
      CRM_KB_CHANGE_RECONCILE_INITIAL_DELAY_MS: ${CRM_KB_CHANGE_RECONCILE_INITIAL_DELAY_MS}
      CRM_KB_KAFKA_ENABLED: ${CRM_KB_KAFKA_ENABLED}
      CRM_KB_KAFKA_TOPIC: ${CRM_KB_KAFKA_TOPIC}
      CRM_KB_KAFKA_GROUP_ID: ${CRM_KB_KAFKA_GROUP_ID}
      CRM_KB_KAFKA_PUBLISH_BATCH_SIZE: ${CRM_KB_KAFKA_PUBLISH_BATCH_SIZE}
      CRM_KB_KAFKA_PUBLISH_DELAY_MS: ${CRM_KB_KAFKA_PUBLISH_DELAY_MS}
      CRM_KB_KAFKA_PUBLISH_INITIAL_DELAY_MS: ${CRM_KB_KAFKA_PUBLISH_INITIAL_DELAY_MS}
      CRM_KB_KAFKA_SEND_TIMEOUT_MS: ${CRM_KB_KAFKA_SEND_TIMEOUT_MS}
    volumes:
      - ./logs/backend:/app/logs
      - ./data/backend:/app/data
      - ./uploads:/app/uploads
    networks:
      - crm-net

  crm-mcp:
    image: crm-mcp:${CRM_VERSION}
    container_name: crm-mcp
    restart: unless-stopped
    depends_on:
      crm-postgres:
        condition: service_healthy
    environment:
      TZ: ${CRM_TIMEZONE}
      JAVA_OPTS: ${CRM_MCP_JAVA_OPTS:-}
      CRM_MCP_PORT: 8091
      CRM_DB_URL: jdbc:postgresql://crm-postgres:5432/${CRM_DB_NAME}
      CRM_DB_USERNAME: ${CRM_DB_USERNAME}
      CRM_DB_PASSWORD: ${CRM_DB_PASSWORD}
      CRM_MCP_JPA_DDL_AUTO: ${CRM_MCP_JPA_DDL_AUTO:-none}
      CRM_DRUID_INITIAL_SIZE: ${CRM_DRUID_INITIAL_SIZE:-1}
      CRM_DRUID_MIN_IDLE: ${CRM_DRUID_MIN_IDLE:-1}
      CRM_DRUID_MAX_ACTIVE: ${CRM_MCP_DRUID_MAX_ACTIVE:-10}
      CRM_DRUID_MAX_WAIT: ${CRM_DRUID_MAX_WAIT:-60000}
      CRM_DRUID_EVICTION_INTERVAL: ${CRM_DRUID_EVICTION_INTERVAL:-60000}
      CRM_DRUID_MIN_EVICTABLE_IDLE_TIME: ${CRM_DRUID_MIN_EVICTABLE_IDLE_TIME:-300000}
      CRM_DRUID_VALIDATION_QUERY: ${CRM_DRUID_VALIDATION_QUERY:-select 1}
      CRM_LOG_LEVEL: ${CRM_LOG_LEVEL:-INFO}
      CRM_LOG_PATH: /app/logs
      CRM_LOG_MAX_HISTORY: ${CRM_LOG_MAX_HISTORY:-30}
      CRM_LOG_MAX_FILE_SIZE: ${CRM_LOG_MAX_FILE_SIZE:-100MB}
      CRM_MCP_ACCESS_TOKEN: ${CRM_MCP_ACCESS_TOKEN:-}
      CRM_MCP_SERVER_ENABLED: ${CRM_MCP_SERVER_ENABLED:-true}
      CRM_MCP_SERVER_NAME: ${CRM_MCP_SERVER_NAME:-crm-business-mcp}
      CRM_MCP_SERVER_VERSION: ${CRM_MCP_SERVER_VERSION:-0.0.1}
      CRM_MCP_SERVER_PROTOCOL: ${CRM_MCP_SERVER_PROTOCOL:-STATELESS}
      CRM_MCP_SERVER_ENDPOINT: ${CRM_MCP_SERVER_ENDPOINT:-/mcp}
      CRM_MCP_SERVER_INSTRUCTIONS: ${CRM_MCP_SERVER_INSTRUCTIONS:-智能营销管理系统业务MCP服务，只能返回真实CRM数据，禁止编造未返回的信息}
    volumes:
      - ./logs/mcp:/app/logs
    ports:
      - "${CRM_MCP_PORT:-8091}:8091"
    networks:
      - crm-net

  crm-ai-runtime:
    image: crm-ai-runtime:${CRM_VERSION}
    container_name: crm-ai-runtime
    restart: unless-stopped
    depends_on:
      crm-postgres:
        condition: service_healthy
    environment:
      TZ: ${CRM_TIMEZONE}
      CRM_AI_INTERNAL_TOKEN: ${CRM_AI_INTERNAL_TOKEN}
      CRM_AI_LOG_LEVEL: ${CRM_AI_LOG_LEVEL}
      CRM_AI_LLM_TIMEOUT_SECONDS: ${CRM_AI_LLM_TIMEOUT_SECONDS}
      CRM_AI_WEB_SEARCH_ENABLED: ${CRM_AI_WEB_SEARCH_ENABLED}
      CRM_AI_WEB_SEARCH_PROVIDER: ${CRM_AI_WEB_SEARCH_PROVIDER}
      CRM_AI_WEB_SEARCH_ENDPOINT: ${CRM_AI_WEB_SEARCH_ENDPOINT}
      CRM_AI_WEB_SEARCH_API_KEY: ${CRM_AI_WEB_SEARCH_API_KEY}
      CRM_AI_WEB_SEARCH_TIMEOUT_SECONDS: ${CRM_AI_WEB_SEARCH_TIMEOUT_SECONDS}
      CRM_AI_WEB_SEARCH_MAX_RESULTS: ${CRM_AI_WEB_SEARCH_MAX_RESULTS}
      CRM_AI_CHECKPOINT_ENABLED: ${CRM_AI_CHECKPOINT_ENABLED}
      CRM_AI_CHECKPOINT_BACKEND: ${CRM_AI_CHECKPOINT_BACKEND}
      CRM_AI_CHECKPOINT_POSTGRES_URI: ${CRM_AI_CHECKPOINT_POSTGRES_URI}
      CRM_AI_CHECKPOINT_AUTO_SETUP: ${CRM_AI_CHECKPOINT_AUTO_SETUP}
      CRM_AI_TRACE_CAPTURE_PAYLOAD: ${CRM_AI_TRACE_CAPTURE_PAYLOAD}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT}
      LANGSMITH_HIDE_INPUTS: ${LANGSMITH_HIDE_INPUTS}
      LANGSMITH_HIDE_OUTPUTS: ${LANGSMITH_HIDE_OUTPUTS}
      LANGGRAPH_STRICT_MSGPACK: ${LANGGRAPH_STRICT_MSGPACK}
    networks:
      - crm-net

  crm-frontend:
    image: crm-frontend:${CRM_VERSION}
    container_name: crm-frontend
    restart: unless-stopped
    depends_on:
      - crm-backend
    environment:
      TZ: ${CRM_TIMEZONE}
      CRM_FRONTEND_API_BASE_URL: ${CRM_FRONTEND_API_BASE_URL}
      CRM_FRONTEND_API_TIMEOUT: ${CRM_FRONTEND_API_TIMEOUT}
      CRM_ASSISTANT_TYPEWRITER_INTERVAL: ${CRM_ASSISTANT_TYPEWRITER_INTERVAL}
      CRM_ASSISTANT_TYPEWRITER_STEP: ${CRM_ASSISTANT_TYPEWRITER_STEP}
      CRM_FRONTEND_APP_ENV: production
    ports:
      - "${CRM_FRONTEND_PORT}:80"
    networks:
      - crm-net

networks:
  crm-net:
    name: crm-net
