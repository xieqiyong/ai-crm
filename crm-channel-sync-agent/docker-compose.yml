services:
  crm-channel-sync:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-channel-sync-agent:latest
    container_name: crm-channel-sync-agent
    restart: unless-stopped
    shm_size: 1gb
    environment:
      DISPLAY: ${DISPLAY:-:99}
      VNC_PASSWORD: ${VNC_PASSWORD}
      CRM_CHANNEL_SYNC_INTERNAL_TOKEN: ${CRM_CHANNEL_SYNC_INTERNAL_TOKEN:-}
      CRM_API_ENABLED: ${CRM_API_ENABLED:-true}
      CRM_API_BASE_URL: ${CRM_API_BASE_URL:-http://host.docker.internal:8088}
      CRM_API_IMPORT_PATH: ${CRM_API_IMPORT_PATH:-/api/internal/channel/source/import-excel}
      CRM_API_TIMEOUT_MS: ${CRM_API_TIMEOUT_MS:-120000}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:6081:6080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
