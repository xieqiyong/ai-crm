<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="智能营销管理系统架构图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#f4f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b54a08"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#9a3412" flood-opacity=".12"/>
    </filter>
    <style>
      .title { font: 800 34px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #2f1c12; }
      .sub { font: 500 15px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #7c5a45; }
      .layer { font: 800 16px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #92400e; letter-spacing: .08em; }
      .box-title { font: 800 18px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #2f1c12; }
      .box-text { font: 500 13px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #6b4a38; }
      .tiny { font: 500 12px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #7c5a45; }
      .box { fill: #fff; stroke: #f0c6a7; stroke-width: 1.5; rx: 18; filter: url(#shadow); }
      .box-soft { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.2; rx: 16; }
      .arrow { stroke: #c2410c; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #f3b27d; stroke-width: 1.5; stroke-dasharray: 5 6; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1090" cy="95" r="170" fill="#fff" opacity=".62"/>
  <circle cx="160" cy="640" r="230" fill="#ffedd5" opacity=".38"/>

  <text x="64" y="62" class="title">智能营销管理系统</text>
  <text x="64" y="91" class="sub">传统 CRM 到 AI CRM 的完整业务闭环：获客、线索、客户、商机、跟进、知识库与智能体协同</text>

  <text x="72" y="150" class="layer">访问入口</text>
  <rect x="170" y="120" width="220" height="82" class="box"/>
  <text x="198" y="153" class="box-title">crm-frontend</text>
  <text x="198" y="178" class="box-text">React + Vite + ECharts</text>
  <text x="198" y="196" class="tiny">统一布局、权限菜单、SSE 渲染</text>

  <rect x="500" y="120" width="220" height="82" class="box"/>
  <text x="528" y="153" class="box-title">crm-gateway</text>
  <text x="528" y="178" class="box-text">统一 API 入口</text>
  <text x="528" y="196" class="tiny">路由、鉴权透传、流式代理</text>

  <text x="72" y="296" class="layer">业务服务</text>
  <rect x="120" y="265" width="230" height="96" class="box"/>
  <text x="148" y="299" class="box-title">crm-web</text>
  <text x="148" y="324" class="box-text">业务接口与权限</text>
  <text x="148" y="342" class="tiny">线索 / 客户 / 商机 / 渠道 / 跟进</text>

  <rect x="405" y="265" width="230" height="96" class="box"/>
  <text x="433" y="299" class="box-title">crm-ai-runtime</text>
  <text x="433" y="324" class="box-text">FastAPI + LangGraph</text>
  <text x="433" y="342" class="tiny">智能体编排、流式回复、Checkpoint</text>

  <rect x="690" y="265" width="230" height="96" class="box"/>
  <text x="718" y="299" class="box-title">crm-mcp</text>
  <text x="718" y="324" class="box-text">CRM MCP 工具服务</text>
  <text x="718" y="342" class="tiny">客户 / 商机 / 跟进工具复用</text>

  <rect x="975" y="265" width="230" height="96" class="box"/>
  <text x="1003" y="299" class="box-title">crm-wecom</text>
  <text x="1003" y="324" class="box-text">企业微信同步</text>
  <text x="1003" y="342" class="tiny">外部联系人、群、渠道沉淀</text>

  <text x="72" y="462" class="layer">数据与中间件</text>
  <rect x="95" y="432" width="165" height="76" class="box-soft"/>
  <text x="123" y="462" class="box-title">PostgreSQL</text>
  <text x="123" y="486" class="tiny">业务数据 / Agent 表</text>

  <rect x="295" y="432" width="165" height="76" class="box-soft"/>
  <text x="323" y="462" class="box-title">Redis</text>
  <text x="323" y="486" class="tiny">登录态 / 缓存</text>

  <rect x="495" y="432" width="165" height="76" class="box-soft"/>
  <text x="523" y="462" class="box-title">Nacos</text>
  <text x="523" y="486" class="tiny">配置中心 / 注册发现</text>

  <rect x="695" y="432" width="165" height="76" class="box-soft"/>
  <text x="723" y="462" class="box-title">MinIO</text>
  <text x="723" y="486" class="tiny">附件 / 音视频</text>

  <rect x="895" y="432" width="165" height="76" class="box-soft"/>
  <text x="923" y="462" class="box-title">ES + Milvus</text>
  <text x="923" y="486" class="tiny">混合检索 / 向量库</text>

  <rect x="1095" y="432" width="125" height="76" class="box-soft"/>
  <text x="1120" y="462" class="box-title">外部能力</text>
  <text x="1120" y="486" class="tiny">大模型 / 火山</text>

  <text x="72" y="610" class="layer">核心闭环</text>
  <rect x="170" y="575" width="940" height="66" rx="18" fill="url(#brand)" opacity=".96"/>
  <text x="218" y="615" style="font:800 20px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#fff;">
    渠道获客 → AI 分析 → 晋升线索 → 跟进沉淀 → 客户转化 → 商机推进 → 产品知识与销售助手持续增强
  </text>

  <path class="arrow" d="M390 161 H500"/>
  <path class="arrow" d="M610 202 V252"/>
  <path class="arrow" d="M500 313 H350"/>
  <path class="arrow" d="M720 313 H635"/>
  <path class="arrow" d="M920 313 H975"/>
  <path class="line" d="M235 361 V432"/>
  <path class="line" d="M520 361 V432"/>
  <path class="line" d="M805 361 V432"/>
  <path class="line" d="M1090 361 V432"/>
</svg>
