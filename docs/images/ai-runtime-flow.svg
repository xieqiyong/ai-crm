<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="AI Runtime 流程图">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <style>
      .title { font: 800 34px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #172033; }
      .sub { font: 500 15px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #637083; }
      .node { fill: #fff; stroke: #c7d2fe; stroke-width: 1.4; rx: 18; filter: url(#shadow2); }
      .node-ai { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; rx: 18; filter: url(#shadow2); }
      .node-title { font: 800 18px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #1e293b; }
      .node-text { font: 500 13px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #64748b; }
      .group-title { font: 800 15px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #7c2d12; letter-spacing: .08em; }
      .arrow { stroke: #2563eb; stroke-width: 2.2; fill: none; marker-end: url(#arrow2); }
      .arrow-ai { stroke: #c2410c; stroke-width: 2.2; fill: none; marker-end: url(#arrow3); }
      .dash { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 6 6; }
    </style>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg2)"/>
  <text x="64" y="62" class="title">LangGraph AI Runtime 运行流程</text>
  <text x="64" y="91" class="sub">配置、Skills、MCP、RAG、模型调用与 SSE 流式输出解耦，支持后续多智能体 Supervisor 编排</text>

  <rect x="62" y="138" width="1156" height="455" rx="26" fill="#ffffff" opacity=".58" stroke="#e2e8f0"/>

  <text x="95" y="178" class="group-title">请求入口</text>
  <rect x="80" y="202" width="180" height="86" class="node"/>
  <text x="108" y="236" class="node-title">前端 / Gateway</text>
  <text x="108" y="262" class="node-text">JWT 鉴权</text>
  <text x="108" y="280" class="node-text">SSE 流式代理</text>

  <text x="345" y="178" class="group-title">运行上下文</text>
  <rect x="320" y="202" width="190" height="86" class="node"/>
  <text x="348" y="236" class="node-title">ContextBuilder</text>
  <text x="348" y="262" class="node-text">加载租户 / 用户</text>
  <text x="348" y="280" class="node-text">场景 / 权限 / 历史</text>

  <rect x="570" y="202" width="190" height="86" class="node"/>
  <text x="598" y="236" class="node-title">能力目录</text>
  <text x="598" y="262" class="node-text">Agent / Skills / MCP</text>
  <text x="598" y="280" class="node-text">先摘要，按需加载</text>

  <text x="850" y="178" class="group-title">LangGraph 编排</text>
  <rect x="820" y="202" width="190" height="86" class="node-ai"/>
  <text x="848" y="236" class="node-title">Supervisor Graph</text>
  <text x="848" y="262" class="node-text">节点状态流转</text>
  <text x="848" y="280" class="node-text">条件边 / 子智能体</text>

  <rect x="80" y="370" width="180" height="86" class="node-ai"/>
  <text x="108" y="404" class="node-title">Tools / MCP</text>
  <text x="108" y="430" class="node-text">CRM 工具调用</text>
  <text x="108" y="448" class="node-text">客户 / 商机 / 跟进</text>

  <rect x="320" y="370" width="190" height="86" class="node-ai"/>
  <text x="348" y="404" class="node-title">RAG 检索</text>
  <text x="348" y="430" class="node-text">ES + Milvus 混合检索</text>
  <text x="348" y="448" class="node-text">知识分片 / index_version</text>

  <rect x="570" y="370" width="190" height="86" class="node-ai"/>
  <text x="598" y="404" class="node-title">LLM Streaming</text>
  <text x="598" y="430" class="node-text">OpenAI Compatible</text>
  <text x="598" y="448" class="node-text">delta / reasoning_content</text>

  <rect x="820" y="370" width="190" height="86" class="node"/>
  <text x="848" y="404" class="node-title">运行存储</text>
  <text x="848" y="430" class="node-text">conversation / agent_run</text>
  <text x="848" y="448" class="node-text">events / token_usage</text>

  <rect x="1060" y="286" width="130" height="86" class="node"/>
  <text x="1083" y="320" class="node-title">前端展示</text>
  <text x="1083" y="346" class="node-text">打字机输出</text>
  <text x="1083" y="364" class="node-text">分析过程折叠</text>

  <rect x="320" y="520" width="440" height="46" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="348" y="549" style="font:700 15px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#1d4ed8;">
    Checkpoint：thread_id 绑定会话，支持状态恢复、断点续跑和过程回放
  </text>

  <path class="arrow" d="M260 245 H320"/>
  <path class="arrow" d="M510 245 H570"/>
  <path class="arrow" d="M760 245 H820"/>
  <path class="arrow-ai" d="M915 288 C915 330, 690 320, 665 370"/>
  <path class="arrow-ai" d="M915 288 C850 350, 505 320, 415 370"/>
  <path class="arrow-ai" d="M915 288 C760 360, 270 325, 170 370"/>
  <path class="arrow" d="M760 413 H820"/>
  <path class="arrow" d="M1010 413 C1050 413, 1060 372, 1060 340"/>
  <path class="dash" d="M415 456 V520"/>
  <path class="dash" d="M665 456 V520"/>
  <path class="dash" d="M915 456 V520"/>

  <text x="84" y="648" style="font:600 14px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#475569;">
    设计原则：Java 负责业务事实与权限，Python 负责智能体编排；Skills/MCP 渐进式披露，避免一次性把所有能力塞进 Prompt。
  </text>
</svg>
