<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企微渠道采集器</title>
    <link rel="stylesheet" href="ui.css">
  </head>
  <body class="popup-body">
    <main class="popup-shell">
      <header class="brand-row">
        <img src="icon.svg" alt="">
        <div>
          <h1>企微渠道采集器</h1>
          <p>智能表格 → CRM渠道</p>
        </div>
      </header>

      <section class="status-card" id="runtimeStatus">
        <span class="status-dot"></span>
        <div>
          <strong>正在读取状态</strong>
          <small>请稍候</small>
        </div>
      </section>

      <section class="action-grid">
        <button class="primary" id="bindCrmButton">绑定当前CRM登录</button>
        <button id="runAllButton">同步全部表格</button>
        <button id="probeButton">检测当前表格</button>
        <button id="armButton">学习一次手动导出</button>
        <button class="wide" id="runCurrentButton">自动同步当前表格</button>
      </section>

      <div class="message" id="message"></div>

      <section class="history-block">
        <div class="section-title">
          <span>最近同步</span>
          <button class="text-button" id="optionsButton">设置</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
